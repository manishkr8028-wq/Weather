<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-cloud-sun"></i> Weather Dashboard</h1>
            <p>Get real-time weather information from anywhere in the world</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        </div>

        <div id="loading" class="loading hidden">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p>Fetching weather data...</p>
        </div>

        <div id="errorMessage" class="error hidden"></div>

        <div id="weatherCard" class="weather-card hidden">
            <div class="city-section">
                <h2 id="cityName"></h2>
                <p id="date"></p>
            </div>

            <div class="main-weather">
                <img id="weatherIcon" src="" alt="Weather icon">
                <div>
                    <h1 id="temperature"></h1>
                    <p id="description"></p>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-card"><i class="fa-solid fa-temperature-half"></i><div><p>Feels Like</p><h3 id="feelsLike"></h3></div></div>
                <div class="detail-card"><i class="fa-solid fa-droplet"></i><div><p>Humidity</p><h3 id="humidity"></h3></div></div>
                <div class="detail-card"><i class="fa-solid fa-wind"></i><div><p>Wind Speed</p><h3 id="wind"></h3></div></div>
                <div class="detail-card"><i class="fa-solid fa-gauge-high"></i><div><p>Pressure</p><h3 id="pressure"></h3></div></div>
                <div class="detail-card"><i class="fa-solid fa-eye"></i><div><p>Visibility</p><h3 id="visibility"></h3></div></div>
                <div class="detail-card"><i class="fa-solid fa-cloud"></i><div><p>Cloudiness</p><h3 id="clouds"></h3></div></div>
            </div>

            <div class="min-max">
                <div><p>Minimum Temperature</p><h3 id="minTemp"></h3></div>
                <div><p>Maximum Temperature</p><h3 id="maxTemp"></h3></div>
            </div>
        </div>

        <div id="welcomeMessage" class="welcome">
            <i class="fa-solid fa-cloud-sun"></i>
            <h2>Welcome!</h2>
            <p>Search for a city to see real-time weather information.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
